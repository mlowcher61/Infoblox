---
# Per-row validation. Called once per CSV row from main.yml.
# Loop var: `row` (a dict with all CSV columns + __lineno__).
#
# Strategy: run a series of asserts. Each failed assert appends a
# 'failed' entry to dns_results with the line number. We never raise
# from here — the caller decides whether to fail the whole job.
#
# Convention: validation only — no API calls, no mutations.

- name: "Required columns are present — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: "{{ _row_errors | default([]) + [item] }}"
  loop:
    - "{{ 'record_type missing' if not row.record_type | default('') else '' }}"
    - "{{ 'name missing' if not row.name | default('') else '' }}"
    - "{{ 'state must be present|absent' if (row.state | default('present')) not in ['present', 'absent'] else '' }}"
    - >-
      {{ 'record_type ' ~ row.record_type ~ ' not in dns_supported_record_types'
         if (row.record_type | default('') | upper) not in dns_supported_record_types
         else '' }}
  when: item != ''

# ─────────────────────────────────────────────────────────────────────
#  CONTRIBUTION POINT #1
#
#  Below is the per-record-type validation block. It currently checks
#  ONLY the A record. Add the asserts your environment needs for the
#  other record types you care about.
#
#  WHY THIS MATTERS: garbage-in == bad DNS in production. The role is
#  only as safe as these checks. Catching a bad ipv6addr in CSV
#  validation costs nothing; catching it after a partial run means
#  someone is paging the on-call.
#
#  Things to consider:
#    - A      → value must look like an IPv4 (ansible.utils.ipv4 filter)
#    - AAAA   → value must look like an IPv6
#    - CNAME  → value must be a hostname (no leading dot, no spaces)
#    - PTR    → name must end in .in-addr.arpa or .ip6.arpa
#    - MX     → priority must be int 0-65535, value must be a hostname
#    - SRV    → priority/weight/port must be ints, target must be a hostname
#    - TXT    → value can be anything but should be quoted in the CSV
#    - NAPTR  → order/preference are ints, flags is a single letter
#    - HOST   → value can be IPv4 OR IPv6 (or a comma-separated list)
#
#  The example for A is below — match its shape for the rest.
#  Append failures to _row_errors; do NOT call ansible.builtin.fail.
# ─────────────────────────────────────────────────────────────────────

- name: "A-record value must be IPv4 — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: "{{ _row_errors | default([]) + ['value ' ~ row.value ~ ' is not a valid IPv4 address'] }}"
  when:
    - (row.record_type | default('') | upper) == 'A'
    - row.value | default('') | ansible.utils.ipv4 | length == 0

- name: "AAAA-record value must be IPv6 — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: "{{ _row_errors | default([]) + ['value ' ~ row.value ~ ' is not a valid IPv6 address'] }}"
  when:
    - (row.record_type | default('') | upper) == 'AAAA'
    - row.value | default('') | ansible.utils.ipv6 | length == 0

# NB: regex_search returns the match string on hit, '' on miss — `not` inverts cleanly.

- name: "CNAME value must look like a hostname — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: "{{ _row_errors | default([]) + ['value ' ~ row.value ~ ' is not a valid hostname'] }}"
  vars:
    _hostname_re: '^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)*[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.?$'
  when:
    - (row.record_type | default('') | upper) == 'CNAME'
    - not (row.value | default('') | regex_search(_hostname_re))

- name: "PTR name must end in .in-addr.arpa or .ip6.arpa — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: "{{ _row_errors | default([]) + ['name ' ~ row.name ~ ' is not a reverse-DNS zone name'] }}"
  when:
    - (row.record_type | default('') | upper) == 'PTR'
    - not (row.name | default('') | regex_search('\.(in-addr\.arpa|ip6\.arpa)\.?$'))

- name: "MX priority must be an int 0..65535 — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: >-
      {{ _row_errors | default([])
         + ['priority ' ~ (row.priority | default('')) ~ ' is not an int in 0..65535'] }}
  when: >-
    (row.record_type | default('') | upper) == 'MX'
    and (
      not (row.priority | default('') | regex_search('^[0-9]+$'))
      or (row.priority | int) < 0
      or (row.priority | int) > 65535
    )

# Suggested SRV column convention (see contribution point #2): priority=priority, extra1=weight, extra2=port.
- name: "SRV priority, weight (extra1), port (extra2) must be ints — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: >-
      {{ _row_errors | default([])
         + ['SRV needs int priority/weight(extra1)/port(extra2); got '
            ~ (row.priority | default('')) ~ '/'
            ~ (row.extra1   | default('')) ~ '/'
            ~ (row.extra2   | default(''))] }}
  when: >-
    (row.record_type | default('') | upper) == 'SRV'
    and (
      not (row.priority | default('') | regex_search('^[0-9]+$'))
      or not (row.extra1 | default('') | regex_search('^[0-9]+$'))
      or not (row.extra2 | default('') | regex_search('^[0-9]+$'))
    )

# HOST `value` may be one IP or a comma-separated mix. Every entry must parse as v4 or v6.
- name: "HOST value must be IPv4, IPv6, or comma-separated mix — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: >-
      {{ _row_errors | default([])
         + ['value ' ~ row.value ~ ' contains entries that are neither IPv4 nor IPv6'] }}
  vars:
    _addrs: "{{ row.value | default('') | split(',') | map('trim') | reject('equalto', '') | list }}"
    _good_count: "{{ (_addrs | ansible.utils.ipv4 | length) + (_addrs | ansible.utils.ipv6 | length) }}"
  when:
    - (row.record_type | default('') | upper) == 'HOST'
    - (_addrs | length == 0) or ((_good_count | int) != (_addrs | length))

# Suggested NAPTR column convention: priority=order, extra1=preference.
- name: "NAPTR order (priority) and preference (extra1) must be ints — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: >-
      {{ _row_errors | default([])
         + ['NAPTR needs int order(priority)/preference(extra1); got '
            ~ (row.priority | default('')) ~ '/'
            ~ (row.extra1   | default(''))] }}
  when: >-
    (row.record_type | default('') | upper) == 'NAPTR'
    and (
      not (row.priority | default('') | regex_search('^[0-9]+$'))
      or not (row.extra1 | default('') | regex_search('^[0-9]+$'))
    )

- name: "Record validation outcome — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    dns_results: "{{ dns_results + [_outcome] }}"
  vars:
    _errs: "{{ _row_errors | default([]) }}"
    _outcome:
      row: "{{ row.__lineno__ }}"
      record: "{{ row }}"
      status: "{{ 'failed' if _errs | length > 0 else 'pending' }}"
      message: "{{ _errs | join('; ') if _errs | length > 0 else 'validation passed' }}"

- name: "Clear per-row error accumulator — line {{ row.__lineno__ }}"
  ansible.builtin.set_fact:
    _row_errors: []
