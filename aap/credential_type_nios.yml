---
# AAP Custom Credential Type: Infoblox NIOS Grid (WAPI)
#
# Import via Controller UI: Administration > Credential Types > Add
# Or via awx-cli / automation-controller-cli.
#
# Maps the user-supplied fields to the env vars consumed by
# infoblox.nios_modules (the collection reads NIOS_HOST / NIOS_USERNAME
# / NIOS_PASSWORD / NIOS_VALIDATE_CERTS automatically when the
# `provider` arg is omitted, which is what we want).

name: Infoblox NIOS Grid
description: Username/password credential for an Infoblox NIOS Grid Master (WAPI).
kind: cloud

inputs:
  fields:
    - id: nios_host
      type: string
      label: Grid Master hostname or IP
    - id: nios_username
      type: string
      label: Username
    - id: nios_password
      type: string
      label: Password
      secret: true
    - id: nios_wapi_version
      type: string
      label: WAPI version
      default: "2.12"
    - id: nios_validate_certs
      type: boolean
      label: Validate TLS certificates
      default: true
  required:
    - nios_host
    - nios_username
    - nios_password

injectors:
  env:
    NIOS_HOST: "{{ nios_host }}"
    NIOS_USERNAME: "{{ nios_username }}"
    NIOS_PASSWORD: "{{ nios_password }}"
    NIOS_WAPI_VERSION: "{{ nios_wapi_version }}"
    NIOS_VALIDATE_CERTS: "{{ nios_validate_certs | string | lower }}"
  extra_vars:
    infoblox_platform: nios
